<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFS 현재 기능 설명</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface-2:#F1F3F6;
    --ink:#18181B;
    --ink-soft:#52525B;
    --ink-muted:#A1A1AA;
    --line:#E4E4E7;
    --accent:#2563EB;
    --accent-soft:rgba(37,99,235,.08);
    --success:#059669;
    --success-soft:rgba(5,150,105,.08);
    --warn:#D97706;
    --warn-soft:rgba(217,119,6,.12);
    --dark:#0B1A24;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body {
    height:100vh;
    overflow:hidden;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
    letter-spacing:0;
    line-height:1.5;
  }
  button { font:inherit; }
  .app {
    display:grid;
    grid-template-columns:280px 1fr;
    grid-template-rows:46px 1fr;
    height:100vh;
  }
  .topbar {
    grid-column:1 / 3;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .brand { display:flex; align-items:center; gap:10px; font-size:12px; font-weight:600; }
  .brand .logo {
    width:24px; height:24px; border-radius:5px;
    display:grid; place-items:center;
    color:white; background:var(--accent);
    font-family:'JetBrains Mono', monospace;
    font-size:10px; letter-spacing:0;
  }
  .brand .label { color:var(--ink-soft); font-weight:500; }
  .topbar-right {
    display:flex; align-items:center; gap:12px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px; color:var(--ink-muted);
    letter-spacing:.08em;
  }
  .live-dot {
    width:6px; height:6px; border-radius:999px;
    background:var(--success);
    box-shadow:0 0 8px var(--success);
  }
  .sidebar {
    background:var(--surface);
    border-right:1px solid var(--line);
    overflow-y:auto;
  }
  .sidebar-header {
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .eyebrow {
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    color:var(--accent);
    letter-spacing:.18em;
    font-weight:600;
    margin-bottom:6px;
  }
  .sidebar h2 {
    font-size:16px;
    font-weight:700;
    line-height:1.28;
  }
  .sidebar p {
    margin-top:5px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .feature-list { padding:8px 8px 18px; }
  .feature-item {
    width:100%;
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:9px 10px;
    margin-bottom:3px;
    border:1px solid transparent;
    border-radius:6px;
    background:transparent;
    text-align:left;
    cursor:pointer;
    transition:background .15s ease, border-color .15s ease;
  }
  .feature-item:hover { background:var(--surface-2); }
  .feature-item.active {
    background:var(--accent-soft);
    border-color:rgba(37,99,235,.25);
  }
  .num {
    flex:0 0 auto;
    width:22px; height:22px;
    border-radius:5px;
    display:grid; place-items:center;
    background:var(--surface-2);
    color:var(--ink-soft);
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    font-weight:600;
  }
  .feature-item.active .num { background:var(--accent); color:white; }
  .item-title { font-size:12.5px; font-weight:700; color:var(--ink); line-height:1.3; }
  .item-desc { margin-top:2px; font-size:10.5px; color:var(--ink-muted); line-height:1.4; }
  .main {
    display:flex;
    flex-direction:column;
    min-width:0;
    overflow:hidden;
  }
  .info-bar {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:10px 18px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    flex:0 0 auto;
  }
  .info-left { display:flex; align-items:center; gap:12px; min-width:0; }
  .info-num {
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--accent);
    letter-spacing:.12em;
    font-weight:600;
    white-space:nowrap;
  }
  .info-title {
    font-size:15px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .info-right { display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .pill {
    padding:3px 9px;
    border-radius:999px;
    border:1px solid rgba(37,99,235,.2);
    background:var(--accent-soft);
    color:var(--accent);
    font-size:10px;
    font-weight:700;
  }
  .ghost-btn {
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--ink-soft);
    border-radius:6px;
    padding:5px 9px;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }
  .canvas {
    flex:1;
    min-height:0;
    padding:14px 18px;
    overflow:hidden;
    position:relative;
  }
  .screen-wrapper {
    height:100%;
    border:1px solid var(--line);
    border-radius:10px;
    background:#0B0E12;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 20px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04);
  }
  .screen {
    position:absolute;
    inset:0;
    display:none;
    background:#111827;
  }
  .screen.active { display:block; }
  .screen img {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
    background:#111827;
  }
  .screen.original {
    overflow:auto;
  }
  .screen.original img {
    width:3840px;
    height:1906px;
    max-width:none;
    object-fit:initial;
  }
  .bubble {
    position:absolute;
    max-width:380px;
    padding:12px 16px;
    border-radius:12px;
    background:rgba(255,245,214,.97);
    color:var(--ink);
    border:1px solid rgba(217,119,6,.36);
    box-shadow:0 12px 34px rgba(15,23,42,.18);
    backdrop-filter:blur(6px);
    animation:pop .28s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop {
    from { opacity:0; transform:translateY(-5px) scale(.98); }
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  .bubble.dark,
  .bubble.warn {
    background:rgba(255,245,214,.97);
    color:var(--ink);
    border-color:rgba(217,119,6,.36);
  }
  .bubble .tag {
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-bottom:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    letter-spacing:.12em;
    color:#B45309;
    font-weight:700;
  }
  .bubble.dark .tag { color:#B45309; }
  .bubble.warn .tag { color:#B45309; }
  .bubble h3 {
    font-size:18px;
    font-weight:800;
    line-height:1.24;
    word-break:keep-all;
  }
  .bubble p {
    margin-top:7px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.52;
    font-weight:500;
    word-break:keep-all;
  }
  .bubble.dark p { color:#553B10; }
  .bubble.warn p { color:#553B10; }
  .arrow-zone {
    position:absolute;
    top:0; bottom:0;
    width:28%;
    z-index:5;
    cursor:pointer;
  }
  .arrow-zone.prev { left:0; }
  .arrow-zone.next { right:0; }
  .footer-hint {
    position:absolute;
    right:14px;
    bottom:12px;
    z-index:6;
    padding:6px 10px;
    border-radius:999px;
    background:rgba(255,255,255,.86);
    color:var(--ink-muted);
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
    letter-spacing:.08em;
    box-shadow:0 4px 14px rgba(15,23,42,.12);
  }
  @media (max-width:1100px) {
    .app { grid-template-columns:230px 1fr; }
    .bubble { max-width:360px; padding:12px 15px; }
    .bubble h3 { font-size:17px; }
    .bubble p { font-size:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo">CFS</div>
      <strong>위치기반 CFS</strong>
      <span class="label">현재 기능 설명</span>
    </div>
    <div class="topbar-right">
      <span class="live-dot"></span>
      <span>GSIM BRIEF · 2026.05.15</span>
    </div>
  </header>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="eyebrow">CURRENT · CFS</div>
      <h2>현재 CFS 기능 구성</h2>
      <p>좌측 항목 또는 화면 좌우 클릭으로 이동</p>
    </div>
    <div class="feature-list" id="featureList"></div>
  </aside>

  <main class="main">
    <div class="info-bar">
      <div class="info-left">
        <span class="info-num" id="infoNum">FEATURE · 00</span>

    </div>
    <section class="canvas">
      <div class="screen-wrapper" id="screenWrapper">
        <div id="screens"></div>
        <div class="arrow-zone prev" id="prevZone" title="이전"></div>
        <div class="arrow-zone next" id="nextZone" title="다음"></div>

    </section>
  </main>
</div>

  }
];

let current = 0;
let originalMode = false;
const list = document.getElementById('featureList');
const screens = document.getElementById('screens');

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function createList() {
  list.innerHTML = features.map((f, i) => `
    <button class="feature-item ${i === 0 ? 'active' : ''}" type="button" data-index="${i}">
      <span class="num">${f.num}</span>
      <span class="body">
        <span class="item-title">${escapeHtml(f.title)}</span>
        <span class="item-desc">${escapeHtml(f.desc)}</span>
      </span>
    </button>
  `).join('');
  list.querySelectorAll('.feature-item').forEach(btn => {
    btn.addEventListener('click', () => selectFeature(Number(btn.dataset.index)));
  });
}

function createScreens() {
  screens.innerHTML = features.map((f, i) => `
    <div class="screen ${i === 0 ? 'active' : ''}" data-index="${i}">
      <img src="${escapeHtml(f.img)}" alt="${escapeHtml(f.title)}" loading="${i === 0 ? 'eager' : 'lazy'}">
      ${(f.bubbles || [f.bubble]).map(b => `
        <div class="bubble ${b.theme}" style="left:${b.x}%; top:${b.y}%;">
          <div class="tag">${escapeHtml(b.tag)}</div>
          <h3>${escapeHtml(b.title)}</h3>
          <p>${escapeHtml(b.text)}</p>
        </div>
      `).join('')}
    </div>
  `).join('');
}

function selectFeature(index) {
  current = Math.max(0, Math.min(features.length - 1, index));
  const f = features[current];
  document.querySelectorAll('.feature-item').forEach((el, i) => el.classList.toggle('active', i === current));
  document.querySelectorAll('.screen').forEach((el, i) => {
    el.classList.toggle('active', i === current);
    el.classList.toggle('original', originalMode && i === current);
  });
  document.getElementById('infoNum').textContent = `FEATURE · ${f.num}`;
  document.getElementById('infoTitle').textContent = f.title;
  document.getElementById('infoPill').textContent = f.pill;
  const activeItem = document.querySelector('.feature-item.active');
  if (activeItem) activeItem.scrollIntoView({block:'nearest'});
  if (location.hash !== `#${f.id}`) history.replaceState(null, '', `#${f.id}`);
}

function navigate(delta) {
  selectFeature((current + delta + features.length) % features.length);
}

document.getElementById('prevZone').addEventListener('click', () => navigate(-1));
document.getElementById('nextZone').addEventListener('click', () => navigate(1));
document.getElementById('toggleOriginal').addEventListener('click', () => {
  originalMode = !originalMode;
  document.getElementById('toggleOriginal').textContent = originalMode ? '화면 맞춤' : '원본 크기';
  selectFeature(current);
});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'Escape' && originalMode) {
    originalMode = false;
    document.getElementById('toggleOriginal').textContent = '원본 크기';
    selectFeature(current);
  }
});

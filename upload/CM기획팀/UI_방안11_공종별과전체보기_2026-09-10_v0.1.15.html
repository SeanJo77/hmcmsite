<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>방안 ⑪ 공종별 ↔ 전체 보기</title><style>
:root{--green:#1F524B;--green-d:#17403A;--amber:#E8B10A;
 --ink-900:#22201B;--ink-700:#474235;--ink-600:#6B6558;--ink-400:#9C968A;--ink-300:#BFB9AE;
 --ink-200:#D8D4CC;--ink-100:#E9E6E0;--ink-50:#F7F6F3;--bg:#F2F1EE;
 --work:#4E9E58;--work-bg:#E2F3E4;
 --font:"Malgun Gothic","맑은 고딕",-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:11px;color:var(--ink-900);background:var(--bg);
 display:flex;flex-direction:column;overflow:hidden}
button,input{font-family:inherit}
.hd{flex:0 0 auto;background:var(--green);padding:7px 14px;display:flex;align-items:center;gap:9px}
.hd .no{width:21px;height:21px;border-radius:50%;background:var(--amber);color:#2A2205;
 font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.hd .ti{color:#fff;font-size:13px;font-weight:700}
.hd .de{color:#B9D0CA;font-size:10.5px}
.hd .sp{flex:1}
.hd .bg{border-radius:9px;padding:2px 9px;font-size:9.5px;font-weight:700}
.hd .bg.o{background:#fff;color:var(--green)}
.hd .bg.x{background:#8A5A12;color:#fff}
.tabs{flex:0 0 auto;background:var(--green-d);padding:5px 10px;display:flex;gap:5px;flex-wrap:wrap}
.tb{border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#DCE8E4;border-radius:3px;
 padding:4px 11px;font-size:10.5px;font-weight:700}
.tb:hover{background:rgba(255,255,255,.22)}
.tb.on{background:var(--amber);color:#2A2205}
/* 「최근 사용」 탭 — 공종 탭과 생김새를 달리한다 */
.tb.rc{background:transparent;color:#F0DFA8;border:1px solid #C8A94E;border-radius:14px;
 padding:3px 14px 3px 11px}
.tb.rc::before{content:'◷';margin-right:5px;font-size:11px}
.tb.rc:hover{background:rgba(232,177,10,.18);color:#fff}
.tb.rc.on{background:var(--amber);border-color:var(--amber);color:#2A2205}
.tbsep{display:inline-block;width:1px;height:15px;background:rgba(255,255,255,.28);margin:0 5px}
.dt2{color:#8A6D14;font-weight:700}
.tile .dt2{color:#8A6D14}
.tile.act .dt2{color:#F3E2A8}
.row{flex:1;display:flex;min-height:0}
.col{flex:0 0 auto;background:#fff;border-right:1px solid var(--ink-200);
 display:flex;flex-direction:column;min-height:0}
.ch{flex:0 0 auto;background:var(--ink-100);border-bottom:1px solid var(--ink-200);padding:5px 9px;
 font-size:9.5px;font-weight:700;color:var(--ink-700)}
.cb{flex:1;overflow:auto}
.ci{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
 padding:5px 9px;font-size:11px;border-bottom:1px solid var(--ink-50);
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci:hover{background:var(--ink-50)}
.ci.on{background:var(--green);color:#fff;font-weight:700}
.ci .k{color:var(--green);font-weight:700;margin-right:6px}
.ci.on .k{color:#fff}
.ci .u{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--work);
 margin-left:5px;vertical-align:middle}
.ci.on .u{background:#fff}
.body{flex:1;min-width:0;background:var(--bg);overflow:auto;padding:12px 14px 28px}
.sheet{max-width:940px;margin:0 auto;background:#fff;border:1px solid var(--ink-300);
 box-shadow:0 1px 6px rgba(0,0,0,.13);padding:16px 18px}
/* 한글 양식 */
.hwt{font-size:13px;font-weight:700;border-bottom:2px solid #000;padding-bottom:5px;margin-bottom:8px}
.hwt span{float:right;font-size:10px;font-weight:400;color:#555}
table.hw{width:100%;border-collapse:collapse;font-size:11px}
table.hw th{border:1px solid #000;background:#EAE8E3;padding:5px 4px;font-weight:700}
table.hw td{border:1px solid #000;padding:4px 7px;vertical-align:top;line-height:1.55}
table.hw td.c{padding-left:10px}
table.hw td.s{white-space:pre-line;font-size:10px;color:#333}
table.hw td.o{text-align:center;white-space:nowrap;font-size:10px;color:#444}
table.hw tr.sc td{background:#F2F1EC;font-weight:700;font-size:11px}
table.hw tr.off td{background:#F7F6F3;color:#A6A197}
table.hw tr.off td.o{color:#7A1A15;font-weight:700}
table.hw tr.sc.off td{background:#EDECE8;color:#8C877D}
/* 절 색인 레일 */
.rail{width:196px;flex:0 0 auto;background:#fff;border-right:1px solid var(--ink-200);
 display:flex;flex-direction:column;min-height:0}
.ri{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;
 cursor:pointer;padding:5px 9px;font-size:11px;border-bottom:1px solid var(--ink-50)}
.ri:hover{background:var(--ink-50)}
.ri i{width:8px;height:8px;border-radius:50%;background:var(--work);flex:0 0 auto}
.ri.off{color:var(--ink-400)}
.ri.off i{background:var(--ink-200)}
.ri span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{margin:7px 9px;border:1px solid var(--ink-300);border-radius:3px;background:var(--ink-50);
 cursor:pointer;padding:5px;font-size:10px;color:var(--ink-700);width:calc(100% - 18px)}
.rb:hover{border-color:var(--green);color:var(--green)}
/* ── 머리 검색 (③에서 떼어 온 부품 · 네 안 모두에 붙는다) ── */
.sb{position:relative;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
 border-radius:4px;padding:3px 9px;min-width:290px}
.sb .mg{color:#CFE3DD;font-size:13px}
.sb input{border:0;background:none;outline:none;color:#fff;font-size:11px;width:100%;padding:2px 0}
.sb input::placeholder{color:#9FBDB5}
.dd{position:absolute;left:0;top:29px;width:460px;background:#fff;border:1px solid var(--ink-300);
 border-radius:4px;box-shadow:0 8px 22px rgba(0,0,0,.22);max-height:400px;overflow:auto;z-index:40}
.dd .sg{display:block;width:100%;text-align:left;border:0;background:none;cursor:pointer;
 padding:6px 11px;border-bottom:1px solid var(--ink-50);font-size:11px;color:var(--ink-900)}
.dd .sg:hover{background:var(--ink-50)}
.dd .sg b{color:var(--green);margin-right:7px}
.dd .sg .pt{color:var(--ink-600);margin-left:8px;font-size:10px}
.dd .sg .pp{display:block;color:var(--ink-400);font-size:9.5px;margin-top:2px}
.dd mark{background:#FCEFB4;padding:0 1px}
.dd .nores{padding:8px 11px;color:var(--ink-400);font-size:10.5px}
.dd .sg .nn{font-size:11.5px;font-weight:700;color:var(--ink-900);margin-right:7px}
.dd .sg b{font-size:10px;color:var(--ink-400);font-weight:700}
.dd .gsum{position:sticky;top:0;background:#FBF7EC;border-bottom:1px solid var(--ink-200);
 padding:6px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;z-index:2}
.dd .gp{background:#fff;border:1px solid var(--ink-300);border-radius:10px;padding:1px 9px;font-size:10px}
.dd .gp b{color:var(--green);margin-left:4px;font-size:10px}
.dd .gt2{margin-left:auto;font-size:9.5px;color:var(--ink-400)}
.dd .ghd{background:var(--ink-100);border-top:1px solid var(--ink-200);
 border-bottom:1px solid var(--ink-200);padding:3px 11px;font-size:9.5px;font-weight:700;
 color:var(--ink-700);display:flex;justify-content:space-between}
.dd .ghd b{color:var(--green)}
/* 검색은 **공종 탭 옆**에 붙는다 */
.tabs .sb{background:rgba(255,255,255,.14);min-width:250px;max-width:330px;margin-left:8px}
.tabs .sb .mg{color:#CFE3DD}
.tabs .sb input{color:#fff}
.tabs .sb input::placeholder{color:#9FBDB5}
.tabs .sb .dd{top:28px}
.hint{font-size:9.5px;color:#9FBDB5;margin-left:8px}
.tb .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);
 margin-left:5px;vertical-align:middle}
.tb.on .dot{background:#2A2205}
/* 보기 전환 (방안 11) */
.sw2{display:flex;border:1px solid var(--ink-300);border-radius:4px;overflow:hidden;flex:0 0 auto}
.sw2 button{border:0;background:#fff;cursor:pointer;padding:5px 14px;font-size:11px;
 color:var(--ink-700);font-weight:700}
.sw2 button+button{border-left:1px solid var(--ink-300)}
.sw2 button.on{background:var(--green);color:#fff}
/* ── 원문 탭 (여러 장을 고르면 늘어난다) ── */
.dtabs{flex:0 0 auto;display:flex;gap:4px;align-items:center;background:var(--ink-100);
 border-bottom:1px solid var(--ink-200);padding:5px 10px;overflow-x:auto}
.dt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink-300);
 background:#fff;border-radius:3px 3px 0 0;cursor:pointer;padding:4px 9px;font-size:10.5px;
 color:var(--ink-700);white-space:nowrap;flex:0 0 auto}
.dt:hover{border-color:var(--green)}
.dt.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.dt b{font-weight:700}
.dt .x{border:0;background:none;cursor:pointer;color:var(--ink-400);font-size:12px;padding:0 1px;
 line-height:1}
.dt.on .x{color:#BCD2CC}
.dt .x:hover{color:#B3261E}
.dtn{font-size:10px;color:var(--ink-400);margin-left:4px;flex:0 0 auto}

/* 원문 탭이 **점검 공정 칸까지 함께 덮는다** — 이 탭에 딸린 것임이 보이도록 */
.docwrap{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.dbody{flex:1;display:flex;min-height:0;border-top:2px solid var(--green)}
.rail .rh2{background:var(--green);color:#fff;padding:6px 9px;font-size:11px;font-weight:700;
 display:flex;align-items:center;gap:6px}
.rail .rh2 .rk{background:var(--amber);color:#2A2205;border-radius:2px;padding:0 6px;font-size:10px}
.rail .rh2 .nm2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .rh2 i{font-style:normal;font-weight:400;font-size:9.5px;color:#BCD2CC;flex:0 0 auto}

/* 격자도 스크롤을 두지 않는다 — 고정 판에 그린 뒤 칸 높이에 맞춰 통째로 줄인다 */
.grid{width:560px;flex:0 0 auto;background:#fff;border-right:1px solid var(--ink-200);
 overflow:hidden;position:relative}
.gw{position:absolute;top:8px;left:10px;width:540px;transform-origin:top left}
.gb{display:flex;align-items:center;gap:6px;margin:8px 0 4px}
.gb:first-child{margin-top:0}
.gl{font-size:10.5px;font-weight:700;background:var(--ink-100);border:1px solid var(--ink-300);
 border-radius:3px;padding:2px 8px}
.gn{flex:1;height:1px;background:var(--ink-200)}
.gt{display:flex;flex-wrap:wrap;gap:4px}
.tile{position:relative;width:172px;min-height:36px;border:1px solid var(--ink-300);border-radius:3px;
 background:#fff;cursor:pointer;padding:3px 7px;text-align:left}
.tile:hover{border-color:var(--green)}
/* 코드명(제목)이 먼저다 — 번호는 아래 작게. 말줄임을 쓰지 않고 줄을 바꾼다 */
.tile b{display:block;font-size:11.5px;font-weight:700;color:var(--ink-900);line-height:1.3;
 white-space:normal;word-break:keep-all}
.tile b .nmh{white-space:nowrap}
.tile b em{font-style:normal;font-size:9px;font-weight:400;color:var(--ink-600);
 white-space:normal;word-break:break-all}
.tile i{display:block;font-size:9px;font-style:normal;color:var(--ink-400);margin-top:1px}
.tile.sel{background:var(--work-bg);border-color:var(--work)}
.tile.act{background:var(--green);border-color:var(--green)}
.tile.act b,.tile.act i,.tile.act b em{color:#fff}
.tile .ck{position:absolute;right:4px;top:3px;font-size:9px;color:var(--work);display:none}
.tile.sel .ck{display:block}
.tile.act .ck{color:#fff}
.tile.hit{border-color:var(--amber);box-shadow:inset 0 0 0 2px #FCEFB4}

/* 사이트맵 — 스크롤 없이 한 판. 고정 판(1600px 폭)에 그린 뒤 화면에 맞춰 통째로 줄인다 */
.smap{flex:1;min-height:0;overflow:hidden;background:var(--bg);position:relative}
.sw{position:absolute;top:8px;left:0;display:flex;gap:22px;align-items:stretch;
 transform-origin:top left}
/* 열마다 아래 끝을 맞춘다 — 남는 자리를 덩어리 사이에 고르게 나눈다 */
.bcol{flex:0 0 auto;display:flex;flex-direction:column;gap:11px;justify-content:space-between}
.gsec{border:1px solid var(--ink-300);border-radius:5px;overflow:hidden;background:#fff;
 box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gh{background:var(--green);color:#fff;font-size:15.5px;font-weight:700;padding:7px 12px;
 display:flex;justify-content:space-between;align-items:center;gap:10px;letter-spacing:-.2px}
.gh span{color:#C9DCD6;font-weight:400;font-size:10.5px;white-space:nowrap}
.gh span b{color:#fff;font-weight:700;margin-left:3px;font-size:11.5px}
/* 중분류와 그에 딸린 체크리스트를 또렷하게 가른다 — 굵은 칸막이 · 번갈아 깔린 바탕 · 초록 표시 */
.mrow{display:flex;align-items:stretch;border-top:2px solid var(--ink-300)}
.mrow:first-of-type{border-top:0}
/* 중분류 칸은 **초록을 칠하지 않는다** — 밝은 종이색 바탕에 짙은 글씨.
   초록은 이름 위 짧은 막대에만 쓴다(공종 머리띠와 헷갈리지 않게) */
.ml{width:112px;flex:0 0 auto;font-size:12.5px;font-weight:700;color:#2E2A22;
 padding:8px;border-right:3px solid #BDB6A8;line-height:1.3;
 display:flex;align-items:flex-start;background:#F3F1EC}
.ml span{display:block;width:100%;word-break:keep-all}
.ml span::before{content:'';display:block;width:18px;height:3px;background:var(--green);
 border-radius:2px;margin:1px 0 5px}
.mrow:nth-of-type(even) .ml{background:#E9E6DF}
.mt{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));
 gap:7px;padding:7px;min-width:0;background:#fff}
.mrow:nth-of-type(even) .mt{background:#FAF9F5}
.mc2{position:relative;min-height:26px;border:1px solid var(--ink-300);background:#fff;
 border-radius:3px;cursor:pointer;padding:3px 8px;text-align:left}
.mc2:hover{border-color:var(--green)}
/* 말줄임(…)을 쓰지 않는다 — 넘치면 줄을 바꾸고, ( ) [ ] 안은 작고 얇게 */
.mc2 b{display:block;font-size:11.5px;font-weight:700;color:var(--ink-900);line-height:1.3;
 white-space:normal;word-break:keep-all}
.mc2 b .nmh{white-space:nowrap}
.mc2 b em{font-style:normal;font-size:9.5px;font-weight:400;color:var(--ink-600);
 white-space:normal;word-break:break-all}
.mc2 i{display:block;font-size:9px;font-style:normal;color:var(--ink-400);margin-top:1px}
.mc2.on{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.mc2.hit{border-color:var(--amber);box-shadow:inset 0 0 0 2px #FCEFB4}
.foot{flex:0 0 auto;background:#fff;border-top:1px solid var(--ink-300);padding:8px 12px;
 display:flex;align-items:center;gap:12px;min-height:52px}
.foot .fk{font-size:13px;font-weight:700}
.foot .fp{font-size:10.5px;color:var(--ink-600)}
.foot .fs{margin-left:auto;font-size:10.5px;color:var(--ink-600);text-align:right;max-width:54%}

.pane2{flex:1;display:flex;min-height:0}
.pane2[hidden]{display:none}
/* 전환 단추는 두 화면에서 **같은 자리**(윗줄 오른쪽 끝)에 있고 이름만 바뀐다 */
.tabs{align-items:center;min-height:31px}
.tabs .sp{flex:1}
.gomap{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.10);color:#fff;
 border-radius:4px;cursor:pointer;padding:4px 14px;font-size:10.5px;font-weight:700;
 display:inline-flex;align-items:center;gap:6px}
.gomap:hover{background:#fff;color:var(--green);border-color:#fff}
.gomap b{font-size:12px;font-weight:700}
.tabs{flex-wrap:wrap}
</style></head><body>
<div class="tabs" id="tabs"><span id="gongs"></span>
  <div class="sb"><span class="mg">⌕</span>
    <input id="q" type="text" placeholder="코드명 · 코드번호 · 중분류 · 점검 공정" autocomplete="off">
    <div class="dd" id="dd" hidden></div></div>
  <span class="hint" id="hint"></span>
  <span class="sp"></span><span id="swbtn"></span></div>
<div class="pane2" id="vGrid">
  <div class="grid" id="grid"></div>
  <div class="docwrap"><div id="dtabs"></div>

량 1.5ℓ/㎡ 이상\n(EXCS 24 70 10 3.10.(6))","적정, 부적정"],["피막 양생제","타이닝 완료 즉시 살포\n전면에 빠짐없이 고르게 살포\n- 성형 즉시 양생포 덮고\n습윤양생 48시간 이상\n- 대기온도 5℃이하 경우","적정, 부적정"],["습윤 양생기간 준수","양생기간 연장\n- 습윤양생 후 기건양생\n72시간 이상\n(\nEXCS 24 70 10 3.5.2 )","적정, 부적정"],["시공의 제한(교통개방시기) 최소 15일","","적정, 부적정"],["인력 마무리 구간 다짐","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\n진동 스크리드 활용\n(B=1.0 이내, 진동수 1,500~2,000VPM)","적정, 부적정"]]],["시공상태 확인 - 검사",[["부착강도","직접 인발 시험\nF28=1.4MPa 이상\n최소 30mm 이상 확보","적정, 부적정"],["최소두께 검사","두께 :\n㎜ ◎\n교량별 1개소 이상 확인\nPRI=160㎜/㎞ 이하\n평탄성 결과기록",""],["평탄성 확인","IRI=2.0m/㎞ 이하\nPRI : ㎜/㎞\n[검교정완료된워킹프로파일로측정] IRI\n: m/㎞\n(EXCS 44 50 15 3.2.19)\n포장손상율에 따른 보수 시행\n0.3%미만 : 부분 재시공(자체)\n포장손상율",""],["교면상태평가 및 보수","0.3~2%미만 : 부분 재시공\n: %\n(보수공법 사업단 승인)\n2%이상 : 전면 재시공\n(보수공법 사업단 승인)","보수 적정여부"],["표시는 기능 및 내구성에 영향을 미치는 항목으로 시공사 품질관리실장 또는 공 사팀장이 직접 확인하여야 함","",""]]]],"362":[["사전 조치사항",[["시공계획서 배합설계 (13-4.5-170) 혼화재","자재 공급계획, 사전 면처리,\n타설, 양생 및 타이닝 계획 등\n공급원 승인\n공급원 승인","제출, 미제출"],["공급원 승인 실리카퓸 등) ( (자재사용보고) 섬유 PVA 시멘트, 골재, 공급원 승인 혼화제, 양생제","공급원 승인\n균열·동결융해·박리·염분침투","시행, 미시행"],["콘크리트 내구성능 사전품질시험","저항성 및 부착강도 확인\n※ 샘플링 감독원 직접 시행\n공장에서 사전 혼합(Pre-mix)\n되어 반입되는 혼화재료는","합격, 불합격"],["공장 검수제","감독원 입회하에 공장 샘플링\n후 성능시험 시행\n공종 착수 전 및 필요시","시행, 미시행"],["품질, 안전 협의체 회의","※ 시공계획, 장비․인력 등 투입계획,\n교육계획, 안전계획\n공종 착수전, 안전교육 및 TBM실시","시행, 미시행"],["근로자 교육","특별안전교육, 신규근로자 교육여부","시행, 미시행"]]],["자재 검사 및 장비 확인",[["실리카퓸 품질기준","비표면적, 활성도지수, 이산\n화규소, 산화마그네슘, 강열\n감량 등\n※현장 반입자재 시험결과 확인\n비중, 직경, 탄성계수, 인장","합격, 불합격"],["친수성 마이크로 PVA 품질기준","강도, 인장신도, 용융점 등\n※현장 반입자재 시험결과 확인","합격, 불합격"],["고로슬래그미분말 품질기 플로우값, 산화마그네슘, 삼산 준 화황, 감열감량, 염화물이온 ※현장 반입자재 시험결과 확인","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\n이산화규소, 습분, 감열감량,\n비중, 분말도, 단위수량비, 압","합격, 불합격"],["플라이애시 품질기준","축강도비\n※현장 반입자재 시험결과 확인\n피막의성질, 컨시스턴시, 저장","합격, 불합격"],["양생제 품질기준 비중, 흡수량, 안정성, No.200체 통과량,마모감량,","안정도, 건조시간, 습기유지 등\n※현장 반입자재 시험결과 확인","합격, 불합격"],["잔골재, 굵은골재 품질기준 연한석편, 점토덩어리 함유량, 비중2.0의 액체에 뜨는것 ※현장 반입자재 시험결과 확인","현장 배치플랜트 또는 주변\n현장B/P,\n레미콘공장에서 생산\n주변레미콘 공장\n․믹서의 비비기 시간 :","합격, 불합격"],["생산 장비","시험배합을 통한 믹 1.8\n0.02~0.1\nPa's\n점도\n( 온도 : 85℃∼105℃)\n300\n~ 1,200g/mol\n중합도\n온도 : 60~70℃)\n(\n수경성 개질 유황의\n반응도\n개질도 98%이상\n※20Ton 마다\n※현장 반입자재 시험결과 확인\n2540 또는 동등이상\nKS F","합격, 불합격"],["양생제 비중, 흡수량, 안정성, 마모 감량, No.200체 통과량, 연한","※현장 반입자재 시험결과 확인","합격, 불합격"],["잔골재, 굵은골재 품질기준 석편, 점토덩어리 함유량, 비 중2.0의 액체에 뜨는 것 ※현장 반입자재 시험결과 확인","","합격, 불합격"],["생산 장비","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\n현장 배치플랜트 또는 연속\n식 믹서(mobile mixer)를 이\n용하여 현장에서 생산\n․믹서의 비비기 시간 :\n시험배합을 통한 믹싱타임 선\n정, 시험불가시 120초 이상\n(2배 이상 초과 금지)\n- 자체동력 전후방 이동가능\n- 배면 스크리드 전면을 위로\n올릴수 있어야함","적정, 부적정"],["마무리 장비","- 2개 이상의 회전 롤러와\n오거 장착\n- 1,500～2,000VPM 의\n진동팬 장착","적정, 부적정"]]],["시공상태 확인 - 배합 및 생산",[["시방배합 실시","승인된 콘크리트 재료를 사\n시방배합\n용하여 시방배합 실시\n: 실시, 미실시\n입도 및 표면수 파악후 수정\n현장배합",""],["현장배합 실시","배합표 작성\n: 실시, 미실시\n재료의 계량오차\n시멘트 : -1~+2%\n물 : -2~+1%",""],["재료의 계량 확인","혼화재 : ±2%\n라텍스 : ±1%\n골재, 혼화제 : ±3%","적정, 부적정"]]],["시공상태 확인 - 교면준비",[["교면상태 점검","바닥판 콘크리트 균열 및 훼\n손상부 보수\n손부 보수 실시\n: 실시, 미실시\n슬래브의 표면을 2㎜ 내외 요\n철이 생기게 절삭(중분대, 방호\n벽 등 측벽 포함)\n(EXCS 24 70 15 3.2.2)\n각종 이물질을 고압수로 살","적정, 부적정"],["시공면 준비","수, 제거\n실시, 미실시\n(레이턴스, 이물질 완전 제거)\n(EXCS 24 70 15 3.2.2)\n청소 후 살수, 최소 습윤기간\n12시간 유지\n(EXCS 24 70 15 3.2.2)","적정, 부적정"],["데크피니셔 레일 설치","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\n이동량 고려 신축이음 후면\n까지 설치\n레일 받침대 중심간격 600mm\n이내 단, 레일 이음부 전․후\n에는 40㎝ 이내\n(레일 이음부 간격은 2m 이상)","적정, 부적정"]]],["시공상태 확인 - 포설 및 마무리",[["시공 제한조건 확인","수분증발량 0.5㎏/㎡/hr 이상\n예상시 타설 금지\n(수분증발량 계산식 활용)\n콘크리트 온도 10~30℃ 이내\n관리\n현장 대기온도 7℃이하, 30℃\n이상일 경우 타설계획 변경\n슬럼프 : 180~220 ㎜","적정, 부적정"],["슬럼프 및 공기량","공기량 : 5~8%\n(1일1회 이상)\n압축강도 : 35MPa이상","적정, 부적정"],["압축강도","(50㎥당 1회, 교량마다 1회이상)\n교면 및 방호벽, 중분대\n실시, 미실시\n측벽에도 실시\n브루밍한 표면이 건조되기\n전 포설","적정, 부적정"],["브루밍 작업","브루밍 작업 후 남은 모르타\n르가 빠진 수경성 개질유황콘\n크리트는 포장 재료에 혼합\n금지","적정, 부적정"],["포설 및 다짐","최소 포설두께 : 30㎜\n- 적정, 부적정",""],["종방향 타이닝","기준:(3±0.5)×(3±1.5)×(16±1)㎜","적정, 부적정"]]],["시공상태 확인 - 양생관리",[["피막양생제 살포","-사용량은 0.4~0.5ℓ/㎡(유성)\n-포설 후 즉시 또는 타이닝 후\n즉시\n- 성형 즉시 양생포 덮고 습윤양\n생 48시간 이상\n- 대기온도 5℃이하 경우 양생","적정, 부적정"],["습윤 양생기간 준수","기간 연장\n- 습윤양생 후 기건양생 72 [["아스팔트 바인더 품질기준 ※현장 반입자재 시험 결과 확인","(EXCS 24\n70\n05 3)\n마모율, 안정성, 파쇄면2면\n이상 비율(%) 등","합격, 불합격"],["골재의 품질기준","※현장 반입자재 시험 결과 확인\n(EXCS 24\n70\n05 3)\n소성지수, 흐름시험(%),","합격, 불합격"],["채움재 품질기준","침수팽창(%), 박리저항성\n※현장 반입자재 시험 결과 확인\n드레인다운시험값 만족","합격, 불합격"],["섬유첨가재 품질기준","※현장 반입자재 시험 결과 확인","합격, 불합격"],["아스팔트 피니셔","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\n포설작업전 스크리드 130℃\n이상 예열\n(EXCS 24\n70\n05 3)\n탬퍼와 진동을 85%정도\n이상으로 설정\n(EXCS 24\n70\n05 3)","적정, 부적정"]]],["시공상태 확인 - 택 코트",[["포장면 상태 확인","뜬돌, 먼지, 기타 유해물 제거\n(EXCS 24\n70\n05 3)\n노출구조물에 AP가 묻지","적정, 부적정"],["역청재 살포전 조치","않도록 사전 조치\n조치, 미조치\n(EXCS 24\n70\n05 3)\n시험살포 실시 후 적정량 산출",""],["역청재 살포량","(보통 0.3∼0.6 ℓ/㎡)\n(EXCS 24\n70\n05 3)\n수분이 건조할 때까지","적정, 부적정"],["역청재 양생시간 준수","충분히 양생\n(EXCS 24\n70\n05 3)\n아스콘 포설전까지 차량출입 통제","적정, 부적정"],["역청재 살포구간 보호조치","(EXCS 24\n70\n05 3)","적정, 부적정"]]],["시공상태 확인 - SMA 혼합물 생산",[["시험 생산","현장 배합설계 후 시험생산을\n실시하여 배합설계와 적합여부 확인\n- 입도, AP함량, 공극률,\n밀도, 골재간극률 등\n(EXCS 24\n70\n05 3)\nㆍ믹서팁 마모상태(2㎝)이내\nㆍ계량장치 검교정 여부","적정, 부적정"],["혼합물 생산시 확인사항","ㆍ유출량 임의조작 여부\nㆍ골재의 입도 변동여부\n- 굵은골재, 잔골재","적정, 부적정"],["골재의 입도관리","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\n콜드빈과 핫빈에서 일3회 이상\n(EXCS 24\n70\n05 3)\n투입방법, 투입시기(골재→섬유","적정, 부적정"],["섬유의 첨가","첨가→AP), 혼합시간 준수여부\n(EXCS 24\n70\n05 3)\nㆍ입하순으로 사용","적정, 부적정"],["채움재","ㆍ회수 더스트(dust) 사용 금지\n(EXCS 24\n70\n05 3)\n혼합시간\n- 마른비빔 5초\n- 젖은비빔 40초 이상","적정, 부적정"],["혼합작업","(EXCS 24\n70\n05 3)\n믹서 배출시 혼합물 온도\n: 170±15℃\n기록지 배합오차 확인\n- 13~10㎜ : ±4%","적정, 부적정"],["아스팔트 혼합물 현장배합오차 확인","- 5,2.5,0.6,0.3,0.15㎜ : ±3%\n- 0.08㎜ : ±2%, AP함량 : ±0.3%\n- 온도 : ±15°c\n(EXCS 24\n70\n05 3)","적정, 부적정"]]],["시공상태 확인 - SMA 시험시공",[["시험포장 확인사항 결과","시험포장 계획서 제출(15일전)\nㆍ시험포장 면적: 500㎡\nㆍ각 구간당 10m이상,\n조정구간 20m이상\nㆍ종단경사 2%이내인 직선구간\n최적 AP함량, 다짐도, 다짐후\n두께, 밀도, 포설, 다짐방법\n등 검토\n(EXCS 24\n70\n05 3)\n시험포장 결과보고서 제출\n(15일 이내)\n(EXCS 24\n70\n05 3)","적정, 부적정"]]],["시공상태 확인 - SMA 포장전 사전조치",[["방수층 시공여부","시트, 도막 방수재 시공 후\n검측 여부 확인\n(EXCS 24\n70\n05 3)\n포트홀 보수, 균열실링,\n표면 청소, 부스러기나\n오염물질 제거, 기존표면","적정, 부적정"],["포장면 정리","편평하지 않은 경우\n레벨링층 시공 또는\n절삭처리\n(EXCS 24\n70\n05 3)\n포장 시공전까지 2회 이상 실시","적정, 부적정"],["장비기사 및 작업자 교육","교육결과 발주처 제출\n(EXCS 24\n70\n05 3)","시행, 미시행"]]],["시공상태 확인 - SMA 포설 및 다짐",[["혼합물 적재","운전석 방향을 기준으로\n상부, 하부, 중앙 순으로 적재\n(EXCS 24\n70\n05 3)\n외기순환에 의한 온도 저하","적정, 부적정"],["운반장비 혼합물 덮개","방지할수 있는 구조\n(EXCS 24\n70\n05 3)\n경유와 등유 등 석유계 사용금지\n- 식물성 오일 또는 전용 부착","적정, 부적정"],["적재함 부착방지제","방지제 사용\n(EXCS 24\n70\n05 3)\n하절기 : 150~160° c\n봄, 가을 : 160~165° c\nPG76-22 이상\n: 상기온도 + 5~10° c","적정, 부적정"],["혼합물 포설온도","지정온도보다 20℃ 이상\n낮을 경우 폐기\n기온 5° c 이하 시공금지\n* 부득이 한 경우 생산온도 증가\n(EXCS 24\n70\n05 3)","적정, 부적정"],["혼합물 포설","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\nㆍ낮은곳에서 높은곳으로\nㆍ길어깨에서 도로중심으로\nㆍ시험시공결과 준수 확인\n(장비대수, 조합, 다짐회수)\nㆍ다짐장비 중량확인\n(물채움 여부 필수 확인)\n마카담로라 12TON 이상\n1,2 차 다짐\n( 타이어 사용불가)\n차 다짐\n진동텐덤로라 10TON 이상","적정, 부적정"],["혼합물 다짐 작업","3\n(EXCS 24\n70\n05 3)\n작업중 장비의 포장면\n정차여부\n세로이음부 측면 다짐\n기포설된 층과의 시공이음부\n시공시 볼록한 모양으로 포설\n(EXCS 24\n70\n05 3)","적정, 부적정"],["포장 이음","가로이음 1m이상 이격\n(EXCS 24\n70\n05 3)\n세로이음 0.15m 이상 이격\n(EXCS 24\n70\n05 3)","적정, 부적정"]]],["시공상태 확인 - 검사",[["다짐 검사","기준 밀도의 97% 이상\nPRI=80㎜/㎞ 이하\n현장권장 기준 : 50㎜/㎞","적정, 부적정"],["본선구간 평탄성","IRI=1.6m/㎞ 이하\n[검교정완료된워킹프로파일로측정]\n※ 평탄성시험결과 첨부\n(EXCS 44 50 10 3.6.11)","적정, 부적정"],["교량 및 교량접속부 평탄성","원도급사\n검측자 점검\n이행 기준\n확인결과\n판정 확인\nPRI=160㎜/㎞ 이하\n현장권장 기준 : 100㎜/㎞\nIRI=2.0m/㎞ 이하\n[검교정 완료된 워킹프로파일로 측정]\n※ 평탄성시험결과 첨부\nㆍ1일 1회 이상","적정, 부적정"],["밀도 (혼합물포설시)","ㆍ포설 1층당 3000㎡마다\n(EXCS 24\n70\n05 3)","적정, 부적정"],["두께 (코어채취)","매차로당 500m 마다\n(EXCS 24\n70\n05 3)","적정, 부적정"],["표시는 기능 및 내구성에 영향을 미치는 항목으로 시공사 품질관리실장 또는 공 사팀장이 직접 확인하여야 함","",""]]]],"371":[["사전 조치사항",[["시공계획서","시공계획서 제출\n(EXCS 24 40 15 1.4)","제출, 미제출"],["배합설계 확인","35MPa\n배합설계 여부\n공급원 승인","적정, 부적정"],["공급원 승인 강재, (자재사용 보고) 알루미늄 난간","※ 충돌시험 합격여부 확인\n(전문시방서 6-331p)\n공종 착수 전 및 필요시","시행, 미시행"],["품질, 안전 협의체 회의","※ 시공계획, 장비․인력 등 투입계획,\n교육계획, 안전계획\n공종 착수전, 안전교육 및 TBM실시","시행, 미시행"],["근로자 교육","특별안전교육, 신규근로자 교육여부","시행, 미시행"]]],["자재 검사",[["강재, 알루미늄 난간 품질기준","화학성분, 인장강도, 연신율 등\n(강재난간\n: KS\nD 3507,\n3517 또는 이와 동등이상, 알\n루미늄난간 : KS D 6008의 제7\n종 AC7A 또는 이와 동등 이 (EXCS 44 50 15 3.1.6)","적정, 부적정"],["운반 관리","하절기, 강풍, 기타의 경우\n혼합물 운반시 덮개설치\n(EXCS 44 50 15 3.1.7)","적정, 부적정"],["타설시간 관리","․비벼진 후부터 치기가 끝날때까지 1시간 이내,\n․내리기 작업후 운반차 세척여부\n(EXCS 44 50 15 3.1.7)","적정, 부적정"],["다짐 관리","다짐작업은 콘크리트가 비벼진 후부터 1시간 이내 완료\n(EXCS 44 50 15 3.1.9)","적정, 부적정"],["시공이음부 설치여부","도로 중심선의 직각, 포장줄눈위치와 30㎝이상 엇갈리게 설치","적정, 부적정"]]],["시공상태 확인 - 빈배합 콘크리트 기층 양생",[["양생관리","살수 또는 비닐덮기 등\n습윤상태 유지\n(EXCS 44 50 15 3.1.12)","적정, 부적정"]]],["시공상태 확인 - 빈배합 콘크리트 기층 검사",[["다짐도","최대건조밀도 (D,E방법)\n현장다짐도 기준 100% 이상\n(EXCS 44 50 15 3.1.9)","적정, 부적정"],["허용오차","다짐후 두께 : 설계두께의\n10% 또는 ±15㎜ 중 작은값\n마무리면 : 계획고±15㎜\n(EXCS 44 50 15 3.1.9)","적정, 부적정"],["허용오차","완성면 3m 직선자 측정시\n오목한 곳의 깊이 10㎜이하\n(EXCS 44 50 15 3.1.11)","적정, 부적정"],["평탄성","PrI = 480㎜/㎞이하\n(EXCS 44 50 15 3.1.11)","적정, 부적정"],["교통개방","재령7일의 압축강도 및\n평탄성 결과 확인후 개방\n(EXCS 44 50 15 3.1.12)","적정, 부적정"]]],["시공상태 확인 - 보강용 콘크리트 슬래브",[["위치 및 규격 적정여부","지지력 불연속, 부등침하 예상\n지점에 설치하며 설계도서와 일치\n(EXCS 44 50 15 3.2.11)","적정, 부적정"],["철근 조립","철근 규격 및 조립상태\n(ECS 44 50 15 3.2.11)","적정, 부적정"],["철근 조립","상･하부 철근간격","적정, 부적정"],["평탄성 측정","교량접속부 전후 10m구간 감독원이 직접 평탄성 측정 및 관리(단차 2㎜이내)\n(EXCS 44 50 15 3.2.11)","적정, 부적정"],["휨강도","접속 및 완충슬래브\n휨강도 f = 4.5 MPa 이상\n(EXCS 44 50 15 3.2.11)","적정, 부적정"]]],["시공상태 확인 - 콘크리트 포장 시험시공",[["시험포장","․시험포장계획서 감독원 승인 여부\n․시험포장 면적: 1,000㎡\n․작업성, 시공성, 두께마무리, 재료분리 여부 판단\n(EXCS 44 50 15 3.2.5)","적정, 부적정"]]],["시공상태 확인 - 콘크리트 포장전 사전조치",[["빈배합 기층면 확인","빈배합 기층면 훼손, 균열,\n골재 탈리부위 보수 실시\n(EXCS 44 50 15 3.2.2)","적정, 부적정"],["측량작업(포장폭 및 높이), 센서라인","․측량결과 기록(20m 간격)\n※ 측량 성과표 첨부\n․유도선 지주간격 및 장력 확인","적정, 부적정"]]],["시공상태 확인 - 분리막 시공",[["분리막 겹이음 시공확인","․전폭설치 원칙\n- 부득이한 경우 세로방향 10㎝, 가로방향 30㎝이상 겹침 확인\n․바람에 날리지 않도록 고정여부 확인\n(EXCS 44 50 15 3.2.2)","적정, 부적정"]]],["시공상태 확인 - 철근 조립 (영업소 광장부, 연속철근 콘크리트 포장만 해당)",[["철근조립","철근 간격 확인","적정, 부적정"],["철근조립","철근 피복 확인","적정, 부적정"],["철근조립","철근 결속상태","적정, 부적정"]]],["시공상태 확인 - 줄눈 설치 위치",[["위치 표시","줄눈위치는 외측에 미리 표시\n(EXCS 44 50 15 3.2.7)","적정, 부적정"],["위치 표시","다웰바 자동삽입기 사용시 줄눈위치에 정확히 시공되는지 여부 반드시 확인","적정, 부적정"],["가로팽창줄눈","시공시작시 온도(℃) - 팽창줄눈의 최대간격(m)","적정, 부적정"]]],["시공상태 확인 - 콘크리트 포장시공(포설)",[["시험배합","시험배합 결과보고서 제출","적정, 부적정"],["재료의 계량 확인","재료계량(%)\n: 시멘트(-1~2), 골재(-3~3), 물(-2~1), 혼화재(-2~2), 혼화제(-3~3)","적정, 부적정"],["생산관리","비비기(시간)\n: 가경식(1분30초),\n강제식(1분 표준)\n* 기준시간 3배이상 초과금지","적정, 부적정"],["슬럼프 및 공기량","․적정 Slump 확인\n- 기계 : 10~60㎜\n- 인력 : 150mm\n․공기량 확인(5~7%)\n(EXCS 44 50 15 3.2.8)","적정, 부적정"],["레미콘 운반","․비비기 후 타설완료까지\n- 덤프 : 1시간이내\n- A/T : 90분이내","적정, 부적정"],["레미콘 운반","운반차의 적재함 물기제거, 틈새제거, 덮개 설치\n(EXCS 44 50 15 3.2.6.4)","적정, 부적정"],["송장 관리","출하 및 타설완료시간\n기록여부","적정, 부적정"],["시공 조건","4°c이하, 35°c이상, 우천시\n시공 금지\n※ 부득이한 경우 한·서중콘크리트 시공계획 감독원 승인후 시공\n(EXCS 44 50 15 3.2.6.5)","적정, 부적정"],["횡방향 처짐관리","모따기 부분을 제외한 포장부분 6㎜이내 관리\n(EXCS 44 50 15 3.2.8)","적정, 부적정"],["포설시 콘크리트 관리","․공기량 : 5~7%\n․페이버 시공시10mm~\n60mm 범위로 관리\n․단위수량 : 배합기준±15㎏/㎥\n․설계기준 휨강도 : 5.0 Mpa 이상\n(EXCS 44 50 15 3.2.4.2)","적정, 부적정"],["포설중단시","줄눈위치에서 50㎝이상\n포설후 시공줄눈 처리\n(EXCS 44 50 15 3.2.7)","적정, 부적정"],["재시공","콘크리트 포설 1시간이상 지연, 강우에 의해 현저히 손상을 입었을 경우\n(EXCS 44 50 15 3.2.7)","적정, 부적정"],["타이닝 제외구간","차선폭 포함 20㎝ 제외","적정, 부적정"],["포장규격 관리 확인 ․100m 마다 측정","설계도면 명시된 규격폭원,두께(설계두께보다 5%이상 부족시 재시공)\n(EXCS 44 50 15 3.2.19)","적정, 부적정"],["타이닝 시공 규격","횡방향 : 폭 3±0.5 ㎜\n깊이 3±1.5 ㎜\n간격 20~30 ㎜\n종방향 : 폭 3±0.5 ㎜\n깊이 3±1.5 ㎜\n간격 16±1.0 ㎜\n(EXCS 44 50 15 3.2.14.4)","적정, 부적정"],["노면요철 포장","설치위치 준수여부\n- 차선끝에서 100㎜ 이격\n- (터널구간)\n‧(좌측) 돌출차선(Type-A) 설치\n‧(우측) 차선끝에서 100㎜ 이격\n(터널구간 노면요철포장 및 차선도색 개선방안 검토, 건설처-1619,2017.4.5.)","적정, 부적정"]]],["시공상태 확인 - 접속부 포설",[["포장 신․구 접속부 기계포설","시공 조인트 접속구간 :\n기존 포장에 접속시켜 기계포설\n(기계포설 2~3m 연장시공\n→ 익일 시공이음부 커팅\n→ 콘크리트 잔재제거\n→ 잔재제거후 접속부 정리\n→ 기계포설)","적정, 부적정"]]],["시공상태 확인 - 줄눈 시공",[["세로줄눈, 가로줄눈 커팅","규격","적정, 부적정"],["세로줄눈, 가로줄눈 커팅","시공","적정, 부적정"],["가로팽창줄눈","규격","적정, 부적정"],["가로팽창줄눈","거푸집\n설치","적정, 부적정"],["실런트 시공기준","․표면보다 9㎜ 낮게 시공\n․주입시기 : 포장양생 기간 이후\n[콘크리트포장 줄눈 손상 방지대책, 품질환경처-572, ‘17.2.22]\n(EXCS 44 50 15 3.2.13.7)","적정, 부적정"],["성형 줄눈재 시공","․모따기 45°이하 경사처리,\n경사면 깊이 3~4㎜\n․줄눈폭의 최대/최소 변화량 고려 설치규격 결정\n[폴리클로로프렌계 성형줄눈재 적용방안, 도로처-1542, ‘13.4.25]","적정, 부적정"]]],["시공상태 확인 - 콘크리트 포장 양생",[["피막양생제 살포","․살포시간\n: 포설 후 30분 이내\n․살포방향\n: 종․횡방향 2회이동\n․살포대상 : 포장상면, 측면\n․살포량 : 0.4~0.5ℓ/㎡\n(EXCS 44 50 15 3.2.16)","적정, 부적정"],["습윤양생","․양생기간\n- 배합강도의 70%(현장양생 공시체)\n- 보통(14일),조강(7일),중용열(21일)\n※수분증발속도가 0.75㎏/㎡/hr 이상시 초기습윤양생(비닐덮기) 검토\n․양생기간 양생중 표지, 침입방지책 등 설치, 감시인 상주\n(전문시방서 10-21p)","적정, 부적정"],["터널내부 포장양생","수성양생제 사용\n․200m이상\n: 입․출구부 60m 양생제 살포\n․200m미만\n: 전구간 양생제 살포\n(EXCS 44 50 15 3.2.16)","적정, 부적정"],["교통개방","강도시험 결과에 따라 감독원 승인후 교통개방\n(EXCS 44 50 15 3.2.17)","적정, 부적정"]]],["시공상태 확인 - 검사",[["본선구간 평탄성","PRI=80㎜/㎞ 이하\n현장권장 기준 : 50㎜/㎞\n(EXCS 44 50 15 3.2.19)\n※ 평탄성시험결과 첨부","적정, 부적정"],["본선구간 평탄성","IRI=1.6m/㎞ 이하\n[검교정 완료된 워킹프로파일로 측정]\n(EXCS 44 50 15 3.2.19)\n※ 평탄성시험결과 첨부","적정, 부적정"],["교량 및 교량접속부 평탄성","PRI=160㎜/㎞ 이하\n현장권장 기준 : 100㎜/㎞\n(EXCS 44 50 15 3.2.19)\n※ 평탄성시험결과 첨부","적정, 부적정"],["교량 및 교량접속부 평탄성","IRI=2.0m/㎞ 이하\n[검교정 완료된 워킹프로파일로 측정]\n(EXCS 44 50 15 3.2.19)\n※ 평탄성시험결과 첨부","적정, 부적정"],["요철 및 계획고 차","․요철 5㎜ 이내\n․임의지점 계획고 차 ±30㎜\n(EXCS 44 50 15 3.2.19)","적정, 부적정"],["면갈이 규격 (다이아몬드절삭기)","폭×간격×높이×깊이(㎜)\n:(3~4)×(2~2.5)×(1.5)×(3.5~5.0)\n최적 규격은 시험작업을 통해 선정\n(EXCS 44 99 35 1.5.1)","적정, 부적정"],["면갈이 상태","전 구간 균등 절삭,\n물고임 등 배수불량 또는 단차로 인한 사고위험 여부 확인","적정, 부적정"],["면갈이 조치","면갈이 완료 후 표면보호제 도포\n보수완료 후 가능한 PrI가\n5㎝/㎞ 이하가 되도록 조치","적정, 부적정"]]]],"411":[["사전 조치사항",[["시공계획서 제출","시험포장, 투입장비,\n일일작업계획 포함\n공종 착수 전 및 필요시","제출, 미제출"],["품질, 안전 협의체 회의","※ 시공계획, 장비․인력 등 투입계획,\n교육계획, 안전계획\n공종 착수전, 안전교육 및 TBM실시","시행, 미시행"],["근로자 교육","특별안전교육, 신규근로자 교육여부\n품질관리담당자 교육 이수","시행, 미시행"],["아스팔트 포장 담당자 교육 이수 프라임코팅용 공급원 승인 역청재 택코팅용 역청재","(시공사, 감리사 등)\n이수, 미이수\n- 포장시공(감리)전문화과정\n시공장비 운전사, 시공관리담당자\n이수, 미이수\n- 포장 기능원 교육\n※ 제조후 60일이내 재료\n공급원 승인\n※ 24시간 양생시간의 확보가 가능한\n경우는 SS(C)-1 우선적 사용","시행, 미시행"],["공급원승인 (자재사용보고) 아스팔트 기층 공급원 승인 아스팔트 중간층 공급원 승인 아스팔트 표층 공급원 승인 굵은골재","단립도, 골재등급기준\n적합여부(고속도로 1등급)\n아스팔트 포장 시공지침, 제2장 3.골재)\n(\n입도, 편장석율, 밀도, 흡수율,\n마모율, 안정성, 파쇄면 비율\n(6개월 이내 시험결과)","시행, 미시행"],["재료기준 잔골재 채움재 아스팔트","입도, 모래당량, 공극율\n(6개월 이내 시험결과)\n입도, 소성지수, 흐름시험,\n침수팽창, 박리저항성\n(6개월 이내 시험결과)\     '<th style="width:18%">원도급사 확인결과</th><th style="width:11%">검측자 판정</th>'+
    '<th style="width:11%">점검 확인</th></tr>';
  (C[act]||[]).forEach(([t,items],i)=>{
    const o=off.has(i);
    h+='<tr class="sc'+(o?' off':'')+'"><td colspan="5">□ '+esc(t)+
       (o?'  <b style="color:#7A1A15">해당사항 없음</b>':'')+'</td></tr>';
    items.forEach(([a,b,opt])=>{
      const ops=(o?'해당사항 없음':(opt||'적합, 부적합')).split(',').map(x=>'○ '+x.trim()).join('&nbsp; ');
      h+='<tr class="'+(o?'off':'')+'"><td class="c">'+esc(a)+'</td><td class="s">'+esc(b)+
         '</td><td class="o">'+ops+'</td><td class="o">○ 적합 ○ 부적합</td><td class="o"></td></tr>';});
  });
  return h+'</table></div>';
}
function railHTML(){
  if(!act) return '<div class="rh2"><i>점검 공정</i></div>';
  const off=offOf();
  let h='<div class="rh2"><span class="rk">'+esc(act)+'</span><span class="nm2">'+esc(NM[act])+
        '</span><i>점검 공정</i></div><div class="cb">';
  (S[act]||[]).forEach(([t,n],i)=>{
    h+='<button class="ri '+(off.has(i)?'off':'')+'" data-s="'+i+'"><i></i><span>'+esc(SH(t))+'</span></button>';});
  return h+'</div><button class="rb" data-allOff>전부 해당없음</button>';
}
function bindMulti(railEl,tabEl,redraw){
  railEl.onclick=ev=>{
    const b=ev.target.closest('[data-s]');
    if(b){const i=+b.dataset.s, o=offOf(); o.has(i)?o.delete(i):o.add(i); OFF[act]=o; redraw(); return;}
    if(ev.target.closest('[data-allOff]')){
      const all=(S[act]||[]).length, o=offOf();
      if(o.size===all) OFF[act]=new Set(); else {OFF[act]=new Set(); for(let i=0;i<all;i++) OFF[act].add(i);}
      redraw();}
  };
  tabEl.onclick=ev=>{
    const x=ev.target.closest('[data-x]'); if(x){dropCode(x.dataset.x);redraw();return;}
    const t=ev.target.closest('[data-t]'); if(t){act=t.dataset.t;redraw();}
  };
}

const RCK='__recent__';                    /* 「최근 사용」 탭 */
function tileHTML(k,n,dt){
  return '<button class="tile '+(sel.includes(k)?'sel':'')+' '+(k===act?'act':'')+' '+
    (SQ&&HITK.has(k)?'hit':'')+'" data-k="'+k+'" title="'+esc(k+' '+n)+
    '"><span class="ck">✓</span><b>'+NMH(n)+'</b><i>'+k+
    (dt?' · <span class="dt2">'+esc(dt)+'</span>':'')+'</i></button>';
}
function gridHTML(g){
  if(g===RCK)
    return '<div class="gw" id="gw"><div class="gb"><span class="gl">마지막 의뢰일 순</span>'+
      '<span class="gn"></span></div><div class="gt">'+
      RECENT.map(k=>tileHTML(k,NM[k],LAST[k])).join('')+'</div></div>';
  return '<div class="gw" id="gw">'+Object.keys(M[g]).map(m=>
    '<div class="gb"><span class="gl">'+esc(m)+'</span><span class="gn"></span></div><div class="gt">'+
    M[g][m].map(([k,n])=>tileHTML(k,n,'')).join('')+'</div>').join('')+'</div>';
}
/* 교량공(44장)처럼 긴 공종도 스크롤 없이 담는다 — 넘치면 판을 넓혀 줄을 줄이고, 그래도 넘치면 줄인다 */
function fitGrid(){
  const box=document.getElementById('grid'), inner=document.getElementById('gw');
  if(!box||!inner) return;
  const bw=box.clientWidth-20, bh=box.clientHeight-16;
  if(!bw||!bh) return;
  let W=bw, s=1;
  for(let i=0;i<3;i++){
    inner.style.transform='none'; inner.style.width=W+'px';
    const H=inner.scrollHeight;
    if(!H) return;
    s=Math.min(1, bh/H);
    if(s>=0.999){ s=1; break; }
    W=Math.round(bw/s);                 /* 줄인 만큼 판을 넓혀 한 줄에 더 담는다 */
  }
  inner.style.width=Math.round(bw/s)+'px';
  inner.style.transform=s<1?'scale('+s+')':'none';
}
window.addEventListener('resize',()=>{ if(document.getElementById('gw')) fitGrid(); });
/* 「최근 사용」은 공종 탭과 생김새를 달리한다. 검색어가 다른 공종에도 걸리면 그 탭에 점을 찍는다 */
function tabsBar(g){
  return '<button class="tb rc '+(g===RCK?'on':'')+'" data-g="'+RCK+'">최근 사용</button>'+
    '<span class="tbsep"></span>'+
    ORDER.map(x=>'<button class="tb '+(x===g?'on':'')+'" data-g="'+x+'">'+esc(x)+
    (SQ&&HITG[x]?'<span class="dot" title="여기에도 '+HITG[x]+'장"></span>':'')+'</button>').join('');
}

const GAP=9;
/* 가장 높은 열이 낮아지도록 나눈다 — 차례는 끊지 않는다(선형 분할·이분 탐색) */
function split(h,N){
  const fits=cap=>{let c=1,s=0;for(const x of h){if(s+x>cap&&s>0){c++;s=x;}else s+=x;}return c<=N;};
  let lo=Math.max.apply(null,h), hi=h.reduce((a,b)=>a+b,0);
  while(lo<hi){const mid=(lo+hi)>>1; if(fits(mid))hi=mid; else lo=mid+1;}
  const gs=[[]]; let s=0;
  for(let i=0;i<h.length;i++){
    if(s+h[i]>lo&&gs[gs.length-1].length){gs.push([]);s=0;}
    gs[gs.length-1].push(i); s+=h[i];
  }
  return {cap:lo,groups:gs};
}

/* 사이트맵 — 공종을 **토 · 배 · 교 · 포 · 부 · 터 · 안 차례 그대로** 세운다.
   묶음 이름은 두지 않는다. 열은 차례를 흐트러뜨리지 않고 **이어진 채로** 나눈다.        */
const cell=(k,n,mark)=>'<button class="mc2 '+(mark&&mark(k)?'on':'')+' '+
  (SQ&&HITK.has(k)?'hit':'')+'" data-k="'+k+'" title="'+esc(k+' '+n)+
  '"><b>'+NMH(n)+'</b><i>'+k+'</i></button>';
function blockHTML(g,mark){
  return '<div class="gsec"><div class="gh">'+esc(g)+
    '<span>중분류<b>'+Object.keys(M[g]).length+'</b> · 체크리스트<b>'+
    Object.values(M[g]).reduce((a,b)=>a+b.length,0)+'</b></span></div>'+
    Object.keys(M[g]).map(m=>'<div class="mrow"><div class="ml"><span>'+MLH(m)+'</span></div>'+
      '<div class="mt">'+M[g][m].map(([k,n])=>cell(k,n,mark)).join('')+
      '</div></div>').join('')+'</div>';
}
function mapHTML(){ return '<div class="sw" id="sw"></div>'; }

/* 열 폭과 열 수를 바꿔 가며 **글자가 가장 커지는** 짜임을 고른다 */
function drawMap(mark){
  const box=document.getElementById('map'), inner=document.getElementById('sw');
  if(!box||!inner) return;
  const blocks=ORDER.map(g=>blockHTML(g,mark));
  /* 앞서 남은 크기·배율을 지우고 잰다 — 안 지우면 다시 그릴 때 배율이 튄다 */
  inner.style.width=''; inner.style.height=''; inner.style.transform='none';
  inner.style.left='0px'; inner.style.top='8px';
  const bw=box.clientWidth-14, bh=box.clientHeight-14;
  if(!(bw>0)||!(bh>0)){ inner.innerHTML='<div class="bcol" style="width:460px">'+blocks.join('')+'</div>'; return; }
  const cands=[];
  for(const cw of [300,340,380,420,460,500,560,620,700,780,860]){
    inner.style.transform='none'; inner.style.width=''; inner.style.height='';
    inner.innerHTML='<div class="bcol" style="width:'+cw+'px">'+blocks.join('')+'</div>';
    const hs=[].map.call(inner.querySelectorAll('.gsec'),e=>e.offsetHeight+11);
    if(!hs.length||!hs.some(x=>x>12)) continue;
    for(let N=2;N<=6;N++){
      const r=split(hs,N), n=r.groups.length;
      const W=n*cw+(n-1)*22;
      const s=Math.min(bw/W, bh/r.cap, 1.6);      /* 지나치게 부풀지 않게 */
      cands.push({s:s,cw:cw,W:W,H:r.cap,groups:r.groups});
    }
  }
  if(!cands.length){ inner.innerHTML='<div class="bcol" style="width:460px">'+blocks.join('')+'</div>'; return; }
  /* 글자 크기를 거의 잃지 않는 짜임 가운데 **가로를 가장 넓게 쓰는** 것을 고른다
     — 높이에 막혀 배율이 더 못 오를 때 좌우가 휑하게 비는 것을 막는다 */
  const top=Math.max.apply(null,cands.map(x=>x.s));
  const best=cands.filter(x=>x.s>=top*0.97).sort((a,b)=>b.W*b.s-a.W*a.s)[0];
  inner.innerHTML=best.groups.map(ix=>'<div class="bcol" style="width:'+best.cw+
    'px;height:'+best.H+'px">'+ix.map(i=>blocks[i]).join('')+'</div>').join('');
  inner.style.width=best.W+'px';
  inner.style.height=best.H+'px';
  inner.style.transform='scale('+best.s+')';
  inner.style.left=Math.max(0,(box.clientWidth-best.W*best.s)/2)+'px';
  inner.style.top=Math.max(6,(box.clientHeight-best.H*best.s)/2)+'px';
}

let g=ORDER[0], view='grid';
const $=x=>document.getElementById(x);
function draw(){
  $('vGrid').hidden=view!=='grid';
  $('vMap').hidden=view!=='map';
  /* 윗줄 — 공종별에만 탭을 둔다. 단추는 두 화면 같은 자리, 이름만 바뀐다 */
  $('gongs').innerHTML=view==='grid'?tabsBar(g):'';
  $('swbtn').innerHTML=view==='grid'
    ? '<button class="gomap" data-v="map"><b>⊞</b>전체 보기</button>'
    : '<button class="gomap" data-v="grid"><b>⊟</b>공종별 선택</button>';
  if(view==='grid'){
    $('grid').innerHTML=gridHTML(g);
    $('cSec').innerHTML=railHTML(); $('dtabs').innerHTML=tabsHTML(); $('doc').innerHTML=docHTML();
    fitGrid();
  }else{
    if(!$('sw')) $('map').innerHTML=mapHTML();
    drawMap(null);
    /* 칸이 막 보이기 시작한 참이라 크기가 아직 확정되지 않을 수 있다 — 한 번 더 맞춘다 */
    requestAnimationFrame(()=>drawMap(null));
  }
  const gs=ORDER.filter(x=>HITG[x]);
  $('hint').innerHTML=(SQ&&gs.length)?'걸린 곳 — '+gs.map(x=>esc(x)+' '+HITG[x]+'장').join(' · '):'';
}
function open(k){ g=GONG[k]; pickCode(k); view='grid'; draw(); }
$('swbtn').onclick=e=>{const v=e.target.closest('[data-v]');if(!v)return;view=v.dataset.v;draw();};
$('gongs').addEventListener('click',e=>{
  const t=e.target.closest('[data-g]'); if(t){g=t.dataset.g;draw();}
});
$('grid').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;toggleCode(b.dataset.k);draw();};
/* 사이트맵에서 고르면 그대로 공종별 화면·원문으로 넘어간다 */
$('map').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;open(b.dataset.k);};
bindMulti($('cSec'),$('dtabs'),draw);
bindSearch(open, draw);
window.addEventListener('resize',draw);
['611','612'].forEach(pickCode); g='터널공'; draw();
</script></body></html>
